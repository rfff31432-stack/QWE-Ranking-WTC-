<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICC World Test Championship Rankings</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f5f5f5;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
background:#fff;
border-radius:12px;
overflow:hidden;
box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.title{
background:#ffffff;
text-align:center;
padding:20px;
}

.title h1{
font-size:28px;
color:#0b2c6d;
}

table{
width:100%;
border-collapse:collapse;
}

thead{
background:#000;
color:#fff;
}

thead th{
padding:18px 10px;
font-size:18px;
text-align:center;
}

tbody td{
padding:20px 10px;
font-size:18px;
text-align:center;
border-bottom:1px solid #e6e6e6;
}

.team{
display:flex;
align-items:center;
gap:12px;
font-weight:700;
color:#0b2c6d;
}

.team img{
width:48px;
height:32px;
object-fit:cover;
border:1px solid #ddd;
}

tbody tr:hover{
background:#f3f7ff;
}

@media(max-width:768px){
thead th,
tbody td{
font-size:15px;
padding:14px 6px;
}
.team img{
width:38px;
height:26px;
}
}
</style>
</head>

<body>
